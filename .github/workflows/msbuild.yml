# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Install Full Python 3.14 x86 (Provides Include headers & libs for compiler)
    - name: Setup Full Python 3.14 Environment
      uses: actions/setup-python@v5
      id: setup-python
      with:
        python-version: '3.14'
        architecture: 'x86'

    # 2. Download corresponding 32-bit Embeddable package for staging the release
    - name: Download and Extract Python 3.14 Embeddable Package
      shell: cmd
      run: |
        set pythonFullVersion=${{ steps.setup-python.outputs.python-version }}
        echo pythonFullVersion=%pythonFullVersion%

        mkdir build\python_embed
        
        :: Fetch the highest stable point-release URL directly via curl
        echo Downloading https://python.org/ftp/python/%pythonFullVersion%/python-%pythonFullVersion%-embed-win32.zip ...
        curl -L "https://python.org/ftp/python/%pythonFullVersion%/python-%pythonFullVersion%-embed-win32.zip" -o python_embed.zip
        
        :: Extract the zip natively using bsdtar (pre-installed on Windows Server)
        tar -xf python_embed.zip -C build\python_embed
        
        del python_embed.zip

    # 3. Add MSBuild to the runner environment
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # 4. Compile the Win32 project targeting x86/Win32
    # Injects the dynamic environment paths from actions/setup-python into MSBuild
    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: |
        echo PythonIncludeDir="${{ env.pythonLocation }}\include"
        echo PythonLibDir="${{ env.pythonLocation }}\libs"
        ls -l "${{ env.pythonLocation }}\include\Python.h"
        ls -l "${{ env.pythonLocation }}\libs\python314.lib"
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:PythonIncludeDir="${{ env.pythonLocation }}\include" /p:PythonLibDir="${{ env.pythonLocation }}\libs" ${{env.SOLUTION_FILE_PATH}}

    # 5. Create setup program with InnoSetup
    - name: Compile .ISS to .EXE Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
      with:
        path: setup_tool_python.iss

    # 6. Publish the setup
    - name: Publish Setup
      uses: actions/upload-artifact@v4
      with:
        # Name of the artifact to upload.
        # Optional. Default is 'artifact'
        name: setup

        # A file, directory or wildcard pattern that describes what to upload
        # Required.
        path: |
          Setup/setup*.exe

        # The desired behavior if no files are found using the provided path.
        # Available Options:
        #   warn: Output a warning but do not fail the action
        #   error: Fail the action with an error message
        #   ignore: Do not output any warnings or errors, the action does not fail
        # Optional. Default is 'warn'
        if-no-files-found: error

        # Duration after which artifact will expire in days. 0 means using default retention.
        # Minimum 1 day.
        # Maximum 90 days unless changed from the repository settings page.
        # Optional. Defaults to repository settings.
        retention-days: 5

        # The level of compression for Zlib to be applied to the artifact archive.
        # The value can range from 0 to 9.
        # For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.
        # Optional. Default is '6'
        compression-level: 6

        # If true, an artifact with a matching name will be deleted before a new one is uploaded.
        # If false, the action will fail if an artifact for the given name already exists.
        # Does not fail if the artifact does not exist.
        # Optional. Default is 'false'
        overwrite: true

        # Whether to include hidden files in the provided path in the artifact
        # The file contents of any hidden files in the path should be validated before
        # enabled this to avoid uploading sensitive information.
        # Optional. Default is 'false'
        include-hidden-files: false

    # 7. Copy to target folder
    - run: |
        mv Release/tool_python.dll Setup/ 
        cp python314._pth Setup/ 
        cp python_scripts/example.py Setup/ 
        cp README.md Setup/ 
        cp LICENSE.txt Setup/ 
        cp PYTHON_LICENSE.txt Setup/ 
        cp documentation/tool_python.chm Setup/ 

    # 8. publish zip for manual installation
    - name: Publish DLL and readme.txt
      uses: actions/upload-artifact@v4
      with:
        # Name of the artifact to upload.
        # Optional. Default is 'artifact'
        name: tool_python

        # A file, directory or wildcard pattern that describes what to upload
        # Required.
        path: |
          Setup/*.dll
          Setup/*._pth
          Setup/*.md
          Setup/*.txt
          Setup/*.html
          Setup/*.chm

        # The desired behavior if no files are found using the provided path.
        # Available Options:
        #   warn: Output a warning but do not fail the action
        #   error: Fail the action with an error message
        #   ignore: Do not output any warnings or errors, the action does not fail
        # Optional. Default is 'warn'
        if-no-files-found: error

        # Duration after which artifact will expire in days. 0 means using default retention.
        # Minimum 1 day.
        # Maximum 90 days unless changed from the repository settings page.
        # Optional. Defaults to repository settings.
        retention-days: 5

        # The level of compression for Zlib to be applied to the artifact archive.
        # The value can range from 0 to 9.
        # For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.
        # Optional. Default is '6'
        compression-level: 6

        # If true, an artifact with a matching name will be deleted before a new one is uploaded.
        # If false, the action will fail if an artifact for the given name already exists.
        # Does not fail if the artifact does not exist.
        # Optional. Default is 'false'
        overwrite: true

        # Whether to include hidden files in the provided path in the artifact
        # The file contents of any hidden files in the path should be validated before
        # enabled this to avoid uploading sensitive information.
        # Optional. Default is 'false'
        include-hidden-files: false


